name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, tests en build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Publieke waarden (zie README). Op forks/PR's zonder variables
          # valt de build terug op een placeholder.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}

      - name: Geen secrets in de build
        run: npm run check:secrets

  database:
    name: Migraties en RLS-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Lokale Supabase starten (database, auth, API en Edge Functions)
        run: >
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor

      - name: Migraties controleren
        run: supabase db lint --fail-on error

      - name: RLS-tests (pgTAP)
        run: |
          set -o pipefail
          if ! supabase test db 2>&1 | tee pgtap.log; then
            # Gefaalde tests als annotatie, zodat ze ook zonder logtoegang zichtbaar zijn.
            msg=$(grep -E 'not ok|^\s*#|ERROR|error|Failed|Dubious|Parse errors|Result' pgtap.log \
              | head -200 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pgTAP-tests gefaald::${msg}"
            exit 1
          fi

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Per functie vanuit de eigen map: anders ziet Deno de package.json in de
      # root en zoekt hij de npm-pakketten in node_modules.
      - name: Edge Functions typechecken
        run: |
          for dir in supabase/functions/*/; do
            (cd "$dir" && deno check index.ts)
          done

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Edge Functions starten
        run: |
          supabase functions serve > functions.log 2>&1 &
          # Wachten tot de functie zelf antwoordt (zonder token: code geen_toegang).
          for i in $(seq 1 60); do
            if curl -s -X POST http://127.0.0.1:54321/functions/v1/wachtwoord-wijzigen | grep -q geen_toegang; then
              echo "Functies staan klaar"; exit 0
            fi
            sleep 2
          done
          cat functions.log
          exit 1

      - name: Integratietest inlogflow (echte Supabase Auth)
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" DB_URL="$DB_URL"
          npm run test:integratie

      - name: Logs van de Edge Functions
        if: failure()
        run: cat functions.log || true

  gitleaks:
    name: Geen secrets in de repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
