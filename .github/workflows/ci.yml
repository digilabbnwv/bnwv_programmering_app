name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, tests en build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # Publieke waarden (zie README). Op forks/PR's zonder variables
          # valt de build terug op een placeholder.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}

      - name: Geen secrets in de build
        run: npm run check:secrets

  database:
    name: Migraties en RLS-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Lokale Supabase starten (alleen database en auth)
        run: >
          supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Migraties controleren
        run: supabase db lint --fail-on error

      - name: RLS-tests (pgTAP)
        run: |
          set -o pipefail
          if ! supabase test db 2>&1 | tee pgtap.log; then
            # Gefaalde tests als annotatie, zodat ze ook zonder logtoegang zichtbaar zijn.
            msg=$(grep -E 'not ok|^\s*#|ERROR|error|Failed|Dubious|Parse errors|Result' pgtap.log \
              | head -200 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pgTAP-tests gefaald::${msg}"
            exit 1
          fi

  gitleaks:
    name: Geen secrets in de repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
