name: Deploy

# Elke push naar main: eerst alle checks uit ci.yml, daarna bouwen en
# publiceren op GitHub Pages. Faalt een check, dan gaat er niets live.
# Supabase (migraties en Edge Functions) wordt bewust niet automatisch
# uitgerold; zie README → Deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nooit twee deploys tegelijk; een lopende deploy wordt niet afgebroken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Bouwen
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          # Geen terugval op een placeholder: zonder echte waarden geen deploy.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error title=Variabelen ontbreken::Zet VITE_SUPABASE_URL en VITE_SUPABASE_PUBLISHABLE_KEY onder Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_IDLE_TIMEOUT_MINUTES: ${{ vars.VITE_IDLE_TIMEOUT_MINUTES || '15' }}

      - name: Geen secrets in de build
        run: npm run check:secrets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publiceren op GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
